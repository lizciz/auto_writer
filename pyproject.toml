[project]
name = "auto_writer"
version = "3.0.0"
description = "Semi-automatic long-form story writer"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "storykit>=0.3.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
aw = "auto_writer.cli:main"
auto_writer = "auto_writer.cli:main"
vc = "auto_writer.validate:main"
validate_chapter = "auto_writer.validate:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["auto_writer*"]

[tool.setuptools.package-data]
auto_writer = ["prompts/**/*.md", "templates/*.md"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
